name: build

# Windows 和 macOS 产物一起出。
# macOS 产物必须在 macOS runner 上构建（需要 Xcode 的 macOS SDK），
# 这台 Windows 开发机上做不到，所以走这里。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            server/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: 装依赖
        run: |
          cd app && npm ci
          cd ../server && npm ci

      - name: 类型检查
        run: cd app && npx tsc --noEmit

      - name: 构建 Windows 安装包
        run: cd app && npx tauri build --bundles nsis

      - name: 传产物
        uses: actions/upload-artifact@v4
        with:
          name: deskalarm-windows
          path: |
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/deskalarm.exe
          if-no-files-found: error

  macos:
    # 只出当前架构，最快。universal 版把下面的 target 改成 universal-apple-darwin
    # 并改成 runs-on: macos-14（Apple Silicon runner）
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            server/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: 装依赖
        run: |
          cd app && npm ci
          cd ../server && npm ci

      - name: 构建 macOS app 和 dmg
        run: cd app && npx tauri build --bundles app,dmg

      - name: 传产物
        uses: actions/upload-artifact@v4
        with:
          name: deskalarm-macos
          path: |
            app/src-tauri/target/release/bundle/macos/*.app
            app/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error