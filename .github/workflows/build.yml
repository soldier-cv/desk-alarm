name: build-client

# 客户端打包。服务端部署在 Woodpecker，那边认 v* tag，这里也认同一个 tag，
# 推一次 v0.2.0 两边一起走：服务端换镜像，客户端出安装包。
#
#   推 tag v*        打包 Windows + macOS，建 Release 并挂上 exe/dmg
#   手动填 tag       同上，用于给某个版本补包或重跑
#   手动不填 tag     只打包，产物留在 workflow artifact，不动 Release
#   PR               只跑静态检查，不打包（省 macOS 额度，几分钟出结果）
#   push main        不触发
#
# 日常改客户端代码不用等 tag：本地 npx tsc --noEmit && npx vite build 就能挡大部分问题。

on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish to (e.g. v0.2.0). Leave empty to upload artifacts only'
        required: false
        type: string

# 同一个 tag 重跑时取消上一次，避免两个 job 同时往一个 Release 里传文件。
# PR 按编号分组：合并队列里 ref_name 是 123/merge 这种值，不能拿来当 key
concurrency:
  group: build-client-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('tag-{0}', inputs.tag || github.ref_name) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: '20'

jobs:
  # tag 或手动填了 tag 才发 Release；PR 和留着空的手动触发只出 artifact
  plan:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.pick.outputs.tag }}
      publish: ${{ steps.pick.outputs.publish }}
    steps:
      - name: Resolve version and publish flag
        id: pick
        env:
          EVENT: ${{ github.event_name }}
          REF_TAG: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "push" ]; then
            TAG="$REF_TAG"
          else
            TAG="$(echo "${INPUT_TAG:-}" | tr -d '[:space:]')"
          fi

          # 手动触发填了 v0.2.0 或 0.2.0 都认，统一带 v 前缀
          if [ -n "$TAG" ] && [ "${TAG#v}" = "$TAG" ]; then TAG="v$TAG"; fi

          if [ -n "$TAG" ] && ! echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "::error::版本号格式不对：$TAG（要形如 v0.2.0）"
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [ -n "$TAG" ]; then echo "publish=true" >> "$GITHUB_OUTPUT"; else echo "publish=false" >> "$GITHUB_OUTPUT"; fi
          echo "版本: ${TAG:-(未指定，只出 artifact)}"

  # PR 上的编译检查：不跑 tauri 真构建，但有问题的代码几分钟内就能看到红叉
  checks:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            server/package-lock.json

      - name: Install dependencies
        run: |
          cd app && npm ci
          cd ../server && npm ci

      - name: Client typecheck
        run: cd app && npx tsc --noEmit

      - name: Client build
        run: cd app && npx vite build

      - name: Theme contrast check
        run: cd app && node scripts/contrast.mjs

      - name: Server address normalization check
        run: cd app && node scripts/url-check.mjs

      - name: Server typecheck and build
        run: |
          cd server
          npm run typecheck
          npm run build

      - name: Requirements alignment check
        run: node scripts/align-check.mjs

  windows:
    if: ${{ github.event_name != 'pull_request' }}
    needs: plan
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            server/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Install dependencies
        run: |
          cd app && npm ci
          cd ../server && npm ci

      - name: Typecheck
        run: cd app && npx tsc --noEmit

      # 更新模块的单元测试（下载地址白名单、版本比较）。
      # 放在这里而不是 PR 的 checks job：那边是 ubuntu，跑 cargo 要装
      # webkit2gtk 等一堆系统库；这里是现成的 Rust 环境，且是发版前必经一步。
      - name: Update module tests
        run: "cd app/src-tauri && cargo test --lib update::"

      # 和本地 build-windows.ps1 -Version 走同一个脚本，产物版本号来源只有一处
      - name: Set version from tag
        if: ${{ needs.plan.outputs.release_tag != '' }}
        run: node scripts/set-version.mjs ${{ needs.plan.outputs.release_tag }}

      # 签名私钥注入后，打包器会给安装包产出同名的 .sig。
      # 没有它客户端会拒绝安装更新（插件验签失败），而不是"跳过校验继续装"
      - name: Build Windows installer
        if: ${{ needs.plan.outputs.publish == 'true' }}
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          cd app
          npx tauri build --bundles nsis

      - name: Build Windows installer (no signing)
        if: ${{ needs.plan.outputs.publish != 'true' }}
        shell: bash
        run: |
          cd app
          npx tauri build --bundles nsis
          # 不发版时打包器仍会生成 .sig（createUpdaterArtifacts），
          # 但那是没签过名的空壳，留着会让人误以为产物可用于更新
          rm -f app/src-tauri/target/release/bundle/nsis/*.sig

      # .sig 必须和安装包一起留着：latest.json 里要填它的内容
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deskalarm-windows
          path: |
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/bundle/nsis/*.sig
            app/src-tauri/target/release/deskalarm.exe
          if-no-files-found: error

      - name: Publish to release
        if: ${{ needs.plan.outputs.publish == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.plan.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          # --verify-tag 要求 tag 已存在于远端。手动触发可能拿一个没推过的 tag，
          # 这里先确认，缺了就明确报错，而不是让 gh 悄悄从默认分支造一个 tag
          if [ -z "$(git ls-remote --tags origin "refs/tags/$TAG")" ]; then
            echo "::error::远端没有 tag $TAG。请先推送该 tag：git push origin $TAG"
            exit 1
          fi
          # Release 不存在就建，已存在（补包重跑）就直接往上加文件，用 --clobber 覆盖同名附件
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "$TAG" --generate-notes --verify-tag

          # 统一成小写连字符的附件名（desk-alarm_<版本>_<架构>），
          # 不用打包器默认的 DeskAlarm_0.2.1_x64-setup.exe
          V="${TAG#v}"
          mkdir -p release-assets
          cp app/src-tauri/target/release/bundle/nsis/*.exe "release-assets/desk-alarm_${V}_x64-setup.exe"
          # 签名文件跟着一起传：latest.json 里的 signature 就是它的内容
          cp app/src-tauri/target/release/bundle/nsis/*.sig "release-assets/desk-alarm_${V}_x64-setup.exe.sig"
          gh release upload "$TAG" \
            "release-assets/desk-alarm_${V}_x64-setup.exe" \
            "release-assets/desk-alarm_${V}_x64-setup.exe.sig" --clobber

  macos:
    if: ${{ github.event_name != 'pull_request' }}
    needs: plan
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            server/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          # GitHub 只保留最新两个 macOS 版本，macos-13 已下线。
          # 用已下线的标签会永远卡在「Waiting for a runner」：不报错也不失败。
          # 这里用 macos-15（arm64），Rust target 必须跟着用 aarch64。
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Install dependencies
        run: |
          cd app && npm ci
          cd ../server && npm ci

      - name: Set version from tag
        if: ${{ needs.plan.outputs.release_tag != '' }}
        run: node scripts/set-version.mjs ${{ needs.plan.outputs.release_tag }}

      # 这里不加 --target：arm64 runner 上默认就编 aarch64，产物落在
      # target/release。一旦加了 --target，路径会变成 target/<triple>/release
      # 私钥注入的意义同 windows job：dmg 旁边会产出 .sig
      - name: Build macOS app and dmg
        if: ${{ needs.plan.outputs.publish == 'true' }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          cd app
          npx tauri build --bundles app,dmg

      - name: Build macOS app and dmg (no signing)
        if: ${{ needs.plan.outputs.publish != 'true' }}
        run: |
          cd app
          npx tauri build --bundles app,dmg
          rm -f app/src-tauri/target/release/bundle/dmg/*.sig

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deskalarm-macos
          path: |
            app/src-tauri/target/release/bundle/macos/*.app
            app/src-tauri/target/release/bundle/dmg/*.dmg
            app/src-tauri/target/release/bundle/dmg/*.sig
          if-no-files-found: error

      - name: Publish to release
        if: ${{ needs.plan.outputs.publish == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.plan.outputs.release_tag }}
        run: |
          set -euo pipefail
          # 两个 job 并发跑，Release 可能已经被 windows 那个建好了
          if [ -z "$(git ls-remote --tags origin "refs/tags/$TAG")" ]; then
            echo "::error::远端没有 tag $TAG。请先推送该 tag：git push origin $TAG"
            exit 1
          fi
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "$TAG" --generate-notes --verify-tag
          # 附件名统一成 desk-alarm_<版本>_<架构>（理由同 windows job）
          V="${TAG#v}"
          mkdir -p release-assets
          cp app/src-tauri/target/release/bundle/dmg/*.dmg "release-assets/desk-alarm_${V}_aarch64.dmg"
          cp app/src-tauri/target/release/bundle/dmg/*.sig "release-assets/desk-alarm_${V}_aarch64.dmg.sig"
          # .app 是目录，打进 zip 才能作为 Release 附件；dmg 本来就能直接下载。
          # 更新走 dmg 而不是 app.zip：插件在 macOS 上装的是 tar.gz/dmg 这类
          # 它认得的形态，zip 里的 .app 它不会用
          ( cd app/src-tauri/target/release/bundle/macos && zip -qry "$GITHUB_WORKSPACE/release-assets/desk-alarm_${V}_aarch64.app.zip" ./*.app )
          gh release upload "$TAG" \
            "release-assets/desk-alarm_${V}_aarch64.dmg" \
            "release-assets/desk-alarm_${V}_aarch64.dmg.sig" \
            "release-assets/desk-alarm_${V}_aarch64.app.zip" --clobber

  # 生成客户端读的 latest.json。
  #
  # 插件要的不是"Release 里有包"，而是一个写着版本号 + 各平台下载 URL +
  # 签名内容的静态 JSON。缺了它客户端连"有没有新版"都问不出来。
  #
  # 两个平台的包由不同 runner 产出，所以这一步必须等 windows/macos 都发完，
  # 再回过头从 Release 上把 URL 抄进 JSON。
  latest-json:
    if: ${{ needs.plan.outputs.publish == 'true' }}
    needs: [plan, windows, macos]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.plan.outputs.release_tag }}
    steps:
      - name: Build and upload latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          V="${TAG#v}"
          GH_REL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          GITEE_REL="https://gitee.com/huaxudong/desk-alarm/releases/download/${TAG}"

          # 签名内容从 GitHub Release 附件里读：两个平台的 .sig 各由
          # 自己那台 runner 传上来，这里只能从远端取
          sig() {
            curl -fsSL "${GH_REL}/$1" | tr -d '\r\n'
          }

          WIN_SIG="$(sig "desk-alarm_${V}_x64-setup.exe.sig")"
          MAC_SIG="$(sig "desk-alarm_${V}_aarch64.dmg.sig")"

          # 签名拿不到就停：没有 signature 客户端会拒绝安装，
          # 而发一个"看起来有新版但装不上"的 JSON 比不发更糟
          if [ -z "$WIN_SIG" ] || [ -z "$MAC_SIG" ]; then
            echo "::error::取不到 .sig（可能打包时没注入 TAURI_SIGNING_PRIVATE_KEY）"
            exit 1
          fi

          NOTES="$(gh release view "$TAG" --json body -q .body | head -c 500)"

          # URL 用 Gitee：客户端主通道是它，国内直连快。
          # 插件会按这里的 URL 下载，签名校验仍由 tauri.conf.json 的 pubkey 兜着，
          # 所以"URL 指向镜像"不等于"放弃验签"
          jq -n \
            --arg v "$V" \
            --arg notes "$NOTES" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg winUrl "${GITEE_REL}/desk-alarm_${V}_x64-setup.exe" \
            --arg winSig "$WIN_SIG" \
            --arg macUrl "${GITEE_REL}/desk-alarm_${V}_aarch64.dmg" \
            --arg macSig "$MAC_SIG" \
            '{
              version: $v,
              notes: $notes,
              pub_date: $date,
              platforms: {
                "windows-x86_64": { url: $winUrl, signature: $winSig },
                "darwin-aarch64": { url: $macUrl, signature: $macSig }
              }
            }' > latest.json

          cat latest.json
          gh release upload "$TAG" latest.json --clobber
          echo "latest.json 已上传（v$V）"

  # GitHub Release 挂好包之后，把同一个 tag 和同样的安装包同步到 Gitee。
  # 单独串成一个 job：windows / macos 两个 job 并发跑在**不同 runner** 上，
  # 产物不在同一台机器，所以只能等两边都发完再从 GitHub Release 回取。
  #
  # continue-on-error 是刻意的：GitHub Release 这时已经建好、用户已经能下载，
  # 镜像失败不该让整个发版显示为失败。代价是失败不在 job 状态里，
  # 所以脚本内部对关键失败一律 `echo ::error::` + exit 1，日志里必须看得见。
  gitee-release:
    if: ${{ needs.plan.outputs.publish == 'true' && github.repository == 'soldier-cv/desk-alarm' }}
    # 排在 latest-json 之后：镜像要连 latest.json 一起搬过去，
    # 否则 Gitee 上有安装包却没有清单，客户端照样问不出版本
    needs: [plan, windows, macos, latest-json]
    runs-on: ubuntu-latest
    env:
      GITEE_OWNER: huaxudong
      GITEE_REPO: desk-alarm
      TAG: ${{ needs.plan.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 检查 GITEE_TOKEN
        id: token
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          if [ -z "${GITEE_TOKEN:-}" ]; then
            # ::error:: 而不是 ::warning::：没有 token 意味着国内用户拿不到镜像通道。
            # 但不 exit 1 —— GitHub Release 这时已经建好了，不该让发版显示为失败。
            echo "::error::未配置 GITEE_TOKEN Secret，Gitee 镜像发布被跳过。国内用户将只能走 GitHub。请在 GitHub 仓库 Settings → Secrets 添加 GITEE_TOKEN。"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 推 tag 到 Gitee
        if: ${{ steps.token.outputs.ok == 'true' }}
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0
          git remote add gitee "https://${GITEE_OWNER}:${GITEE_TOKEN}@gitee.com/${GITEE_OWNER}/${GITEE_REPO}.git"
          git fetch --tags origin "refs/tags/${TAG}:refs/tags/${TAG}"
          git push gitee "refs/tags/${TAG}:refs/tags/${TAG}" --force

      - name: 从 GitHub Release 取安装包
        if: ${{ steps.token.outputs.ok == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p assets
          gh release download "$TAG" --dir assets
          ls -l assets

      - name: 同步 Release 到 Gitee
        if: ${{ steps.token.outputs.ok == 'true' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          set -uo pipefail
          API="https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}"

          # Release 说明直接复用 GitHub 那份，两边内容不会分叉
          BODY="$(gh release view "$TAG" --json body -q .body || true)"
          [ -n "$BODY" ] || BODY="桌面提醒工具（Windows 安装版 / macOS dmg 与 app）。国内高速下载。"

          # 1. 建 Release。用 multipart form 而不是 JSON：Gitee 对 application/json
          #    的 POST 有概率被 WAF 拦成 400，form 一直正常；顺带也免了正文里
          #    中文换行的编码问题。
          ID=""
          CREATE="$(curl -sS -X POST "${API}/releases" \
            -F "access_token=${GITEE_TOKEN}" \
            -F "tag_name=${TAG}" \
            -F "target_commitish=main" \
            -F "name=DeskAlarm ${TAG}" \
            -F "body=${BODY}" \
            -F "prerelease=false" || true)"
          ID="$(printf '%s' "$CREATE" | jq -r '.id // empty' || true)"
          [ -n "$ID" ] && echo "Gitee Release 已创建，id=$ID"

          # 2. 没拿到 id 说明已存在（补包重跑），查出来复用并刷新说明
          if [ -z "$ID" ]; then
            echo "创建未返回 id，查已有 Release（$TAG）..."
            ID="$(curl -sS "${API}/releases/tags/${TAG}?access_token=${GITEE_TOKEN}" | jq -r '.id // empty' || true)"
            if [ -n "$ID" ]; then
              curl -sS -X PATCH "${API}/releases/${ID}" \
                -F "access_token=${GITEE_TOKEN}" \
                -F "tag_name=${TAG}" \
                -F "name=DeskAlarm ${TAG}" \
                -F "body=${BODY}" || echo "::warning::Gitee Release 说明刷新失败，附件仍会上传"
            fi
          fi

          # 3. 拿不到 id 就停：Release 可能已经被建出来了却没拿到 id，
          #    那会留下一个「有 Release、无附件」的空壳 —— 比没有更糟，
          #    用户点进去发现新版本却下不到东西。
          if [ -z "$ID" ]; then
            echo "::error::没拿到 Gitee Release id，附件未上传。创建响应：$CREATE"
            exit 1
          fi

          # 4. 逐个上传。Gitee 这边同名附件会 400，先删旧的再传
          ok=0
          for f in assets/*; do
            [ -f "$f" ] || continue
            n="$(basename "$f")"
            for old in $(curl -sS "${API}/releases/${ID}/attach_files?access_token=${GITEE_TOKEN}" \
                           | jq -r --arg n "$n" '.[] | select(.name == $n) | .id' || true); do
              curl -sS -X DELETE "${API}/releases/${ID}/attach_files/${old}?access_token=${GITEE_TOKEN}" || true
            done

            uploaded=0
            for attempt in 1 2 3; do
              echo "上传 $n（第 $attempt 次）"
              resp="$(curl -sS -X POST "${API}/releases/${ID}/attach_files?access_token=${GITEE_TOKEN}" \
                       -F "access_token=${GITEE_TOKEN}" \
                       -F "file=@${f};filename=${n};type=application/octet-stream" || true)"
              if printf '%s' "$resp" | jq -e '.id or .browser_download_url' >/dev/null 2>&1; then
                uploaded=1
                ok=$((ok+1))
                break
              fi
              echo "::warning::$n 上传失败：$resp"
              sleep 5
            done

            if [ "$uploaded" != "1" ]; then
              echo "::error::$n 三次上传均失败，Gitee Release ${TAG} 缺少该文件。请手动到 Gitee 后台补传，或删除该 Release 重跑。"
              exit 1
            fi
          done

          if [ "$ok" -eq 0 ]; then
            echo "::error::assets 目录为空，没有任何附件上传"
            exit 1
          fi
          echo "Gitee Release ${TAG} 同步完成（${ok} 个附件）"

      # latest.json 里的 URL 指向 Gitee，而"清单传上去了"不代表"包也传上去了"。
      # 两者不同步时客户端已经判定有新版、点下去却 404 —— 比没有更新更难排查。
      - name: 校验镜像上的下载地址
        if: ${{ steps.token.outputs.ok == 'true' }}
        run: |
          set -uo pipefail
          base="https://gitee.com/${GITEE_OWNER}/${GITEE_REPO}/releases/download/${TAG}"
          bad=""
          for name in $(jq -r '.platforms[].url' assets/latest.json | sed "s|.*/||"); do
            code="$(curl -sS -o /dev/null -w '%{http_code}' -L --max-time 30 "${base}/${name}" || echo 000)"
            if [ "$code" != "200" ]; then
              echo "::error::镜像上 ${name} 不可下载（HTTP ${code}）"
              bad="1"
            else
              echo "OK ${name}"
            fi
          done
          if [ -n "$bad" ]; then
            echo "::error::镜像附件不完整，客户端会下载失败。请重跑本 job 或手动补传。"
            exit 1
          fi
