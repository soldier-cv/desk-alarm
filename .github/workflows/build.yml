name: build-client

# 客户端打包。服务端部署在 Woodpecker，那边认 v* tag，这里也认同一个 tag，
# 推一次 v0.2.0 两边一起走：服务端换镜像，客户端出安装包。
#
#   推 tag v*        打包 Windows + macOS，建 Release 并挂上 exe/dmg
#   手动填 tag       同上，用于给某个版本补包或重跑
#   手动不填 tag     只打包，产物留在 workflow artifact，不动 Release
#   PR               只跑静态检查，不打包（省 macOS 额度，几分钟出结果）
#   push main        不触发
#
# 日常改客户端代码不用等 tag：本地 npx tsc --noEmit && npx vite build 就能挡大部分问题。

on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish to (e.g. v0.2.0). Leave empty to upload artifacts only'
        required: false
        type: string

# 同一个 tag 重跑时取消上一次，避免两个 job 同时往一个 Release 里传文件。
# PR 按编号分组：合并队列里 ref_name 是 123/merge 这种值，不能拿来当 key
concurrency:
  group: build-client-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('tag-{0}', inputs.tag || github.ref_name) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: '20'

jobs:
  # tag 或手动填了 tag 才发 Release；PR 和留着空的手动触发只出 artifact
  plan:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.pick.outputs.tag }}
      publish: ${{ steps.pick.outputs.publish }}
    steps:
      - name: Resolve version and publish flag
        id: pick
        env:
          EVENT: ${{ github.event_name }}
          REF_TAG: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "push" ]; then
            TAG="$REF_TAG"
          else
            TAG="$(echo "${INPUT_TAG:-}" | tr -d '[:space:]')"
          fi

          # 手动触发填了 v0.2.0 或 0.2.0 都认，统一带 v 前缀
          if [ -n "$TAG" ] && [ "${TAG#v}" = "$TAG" ]; then TAG="v$TAG"; fi

          if [ -n "$TAG" ] && ! echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "::error::版本号格式不对：$TAG（要形如 v0.2.0）"
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [ -n "$TAG" ]; then echo "publish=true" >> "$GITHUB_OUTPUT"; else echo "publish=false" >> "$GITHUB_OUTPUT"; fi
          echo "版本: ${TAG:-(未指定，只出 artifact)}"

  # PR 上的编译检查：不跑 tauri 真构建，但有问题的代码几分钟内就能看到红叉
  checks:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            server/package-lock.json

      - name: Install dependencies
        run: |
          cd app && npm ci
          cd ../server && npm ci

      - name: Client typecheck
        run: cd app && npx tsc --noEmit

      - name: Client build
        run: cd app && npx vite build

      - name: Theme contrast check
        run: cd app && node scripts/contrast.mjs

      - name: Server address normalization check
        run: cd app && node scripts/url-check.mjs

      - name: Server typecheck and build
        run: |
          cd server
          npm run typecheck
          npm run build

      - name: Requirements alignment check
        run: node scripts/align-check.mjs

  windows:
    if: ${{ github.event_name != 'pull_request' }}
    needs: plan
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            server/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Install dependencies
        run: |
          cd app && npm ci
          cd ../server && npm ci

      - name: Typecheck
        run: cd app && npx tsc --noEmit

      # 和本地 build-windows.ps1 -Version 走同一个脚本，产物版本号来源只有一处
      - name: Set version from tag
        if: ${{ needs.plan.outputs.release_tag != '' }}
        run: node scripts/set-version.mjs ${{ needs.plan.outputs.release_tag }}

      - name: Build Windows installer
        shell: bash
        run: |
          cd app
          npx tauri build --bundles nsis

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deskalarm-windows
          path: |
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/deskalarm.exe
          if-no-files-found: error

      - name: Publish to release
        if: ${{ needs.plan.outputs.publish == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.plan.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          # --verify-tag 要求 tag 已存在于远端。手动触发可能拿一个没推过的 tag，
          # 这里先确认，缺了就明确报错，而不是让 gh 悄悄从默认分支造一个 tag
          if [ -z "$(git ls-remote --tags origin "refs/tags/$TAG")" ]; then
            echo "::error::远端没有 tag $TAG。请先推送该 tag：git push origin $TAG"
            exit 1
          fi
          # Release 不存在就建，已存在（补包重跑）就直接往上加文件，用 --clobber 覆盖同名附件
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "$TAG" --generate-notes --verify-tag

          # 统一成小写连字符的附件名（desk-alarm_<版本>_<架构>），
          # 不用打包器默认的 DeskAlarm_0.2.1_x64-setup.exe
          V="${TAG#v}"
          mkdir -p release-assets
          cp app/src-tauri/target/release/bundle/nsis/*.exe "release-assets/desk-alarm_${V}_x64-setup.exe"
          gh release upload "$TAG" "release-assets/desk-alarm_${V}_x64-setup.exe" --clobber

  macos:
    if: ${{ github.event_name != 'pull_request' }}
    needs: plan
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            server/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          # GitHub 只保留最新两个 macOS 版本，macos-13 已下线。
          # 用已下线的标签会永远卡在「Waiting for a runner」：不报错也不失败。
          # 这里用 macos-15（arm64），Rust target 必须跟着用 aarch64。
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Install dependencies
        run: |
          cd app && npm ci
          cd ../server && npm ci

      - name: Set version from tag
        if: ${{ needs.plan.outputs.release_tag != '' }}
        run: node scripts/set-version.mjs ${{ needs.plan.outputs.release_tag }}

      # 这里不加 --target：arm64 runner 上默认就编 aarch64，产物落在
      # target/release。一旦加了 --target，路径会变成 target/<triple>/release
      - name: Build macOS app and dmg
        run: |
          cd app
          npx tauri build --bundles app,dmg

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deskalarm-macos
          path: |
            app/src-tauri/target/release/bundle/macos/*.app
            app/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

      - name: Publish to release
        if: ${{ needs.plan.outputs.publish == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.plan.outputs.release_tag }}
        run: |
          set -euo pipefail
          # 两个 job 并发跑，Release 可能已经被 windows 那个建好了
          if [ -z "$(git ls-remote --tags origin "refs/tags/$TAG")" ]; then
            echo "::error::远端没有 tag $TAG。请先推送该 tag：git push origin $TAG"
            exit 1
          fi
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "$TAG" --generate-notes --verify-tag
          # 附件名统一成 desk-alarm_<版本>_<架构>（理由同 windows job）
          V="${TAG#v}"
          mkdir -p release-assets
          cp app/src-tauri/target/release/bundle/dmg/*.dmg "release-assets/desk-alarm_${V}_aarch64.dmg"
          # .app 是目录，打进 zip 才能作为 Release 附件；dmg 本来就能直接下载
          ( cd app/src-tauri/target/release/bundle/macos && zip -qry "$GITHUB_WORKSPACE/release-assets/desk-alarm_${V}_aarch64.app.zip" ./*.app )
          gh release upload "$TAG" "release-assets/desk-alarm_${V}_aarch64.dmg" "release-assets/desk-alarm_${V}_aarch64.app.zip" --clobber

  # GitHub Release 挂好包之后，把同一个 tag 和同样的安装包同步到 Gitee。
  # 单独串成一个 job：windows / macos 两个 job 并发，谁都不该去建 Gitee Release
  gitee-release:
    if: ${{ needs.plan.outputs.publish == 'true' }}
    needs: [plan, windows, macos]
    runs-on: ubuntu-latest
    env:
      GITEE_REPO: huaxudong/desk-alarm
      TAG: ${{ needs.plan.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 推 tag 到 Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0
          if [ -z "${GITEE_TOKEN:-}" ]; then
            echo "::error::缺少 GITEE_TOKEN"
            exit 1
          fi
          git remote add gitee "https://huaxudong:${GITEE_TOKEN}@gitee.com/${GITEE_REPO}.git"
          git fetch --tags origin "refs/tags/${TAG}:refs/tags/${TAG}"
          git push gitee "refs/tags/${TAG}:refs/tags/${TAG}"

      - name: 从 GitHub Release 取安装包
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p assets
          gh release download "$TAG" --dir assets
          ls -l assets

      - name: 同步到 Gitee Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          set -euo pipefail
          API="https://gitee.com/api/v5/repos/${GITEE_REPO}"

          # 已经建过（补包重跑）就复用，没有才新建。tag 在上一步已经推过去了
          ID="$(curl -sS --fail-with-body "${API}/releases/tags/${TAG}?access_token=${GITEE_TOKEN}" | jq -r '.id // empty' || true)"
          if [ -z "$ID" ]; then
            BODY="$(gh release view "$TAG" --json body -q .body)"
            ID="$(jq -n --arg tag "$TAG" --arg name "$TAG" --arg body "$BODY" \
                    '{tag_name:$tag, name:$name, body:$body, target_commitish:"main", prerelease:false}' \
                  | curl -sS --fail-with-body -X POST "${API}/releases?access_token=${GITEE_TOKEN}" \
                      -H 'Content-Type: application/json' -d @- | jq -r '.id')"
          fi
          if [ -z "$ID" ]; then
            echo "::error::Gitee Release 没建出来"
            exit 1
          fi
          echo "Gitee Release $TAG id=$ID"

          for f in assets/*; do
            n="$(basename "$f")"
            # 同名附件先删掉，重跑时不会堆出一串重复文件
            for old in $(curl -sS --fail-with-body "${API}/releases/${ID}/attach_files?access_token=${GITEE_TOKEN}" \
                           | jq -r --arg n "$n" '.[] | select(.name == $n) | .id'); do
              curl -sS --fail-with-body -X DELETE "${API}/releases/${ID}/attach_files/${old}?access_token=${GITEE_TOKEN}"
            done
            echo "上传 $n"
            curl -sS --fail-with-body --retry 3 --retry-delay 5 -X POST "${API}/releases/${ID}/attach_files" \
              -F "access_token=${GITEE_TOKEN}" -F "file=@${f}"
            echo
          done
          echo "Gitee Release ${TAG} 已同步"
