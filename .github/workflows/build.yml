name: build

# Windows 和 macOS 产物一起出。
# macOS 产物必须在 macOS runner 上构建（需要 Xcode 的 macOS SDK），
# 这台 Windows 开发机上做不到，所以走这里。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            server/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: 装依赖
        run: |
          cd app && npm ci
          cd ../server && npm ci

      - name: 类型检查
        run: cd app && npx tsc --noEmit

      - name: 构建 Windows 安装包
        run: cd app && npx tauri build --bundles nsis

      - name: 传产物
        uses: actions/upload-artifact@v4
        with:
          name: deskalarm-windows
          path: |
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/deskalarm.exe
          if-no-files-found: error

  macos:
    # GitHub 只保留最新两个 macOS 版本，macos-13 已下线。
    # 用已下线的标签会永远卡在「Waiting for a runner to pick up this job」：
    # 不报错也不失败，就一直等下去，很容易被当成 CI 挂了。
    # 这里用 macos-15（arm64，未标废弃），Rust target 必须跟着用 aarch64。
    # 要出 Intel 版改用 macos-15-intel + x86_64-apple-darwin。
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            server/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          # 架构必须和 runner 一致，否则 tauri build 会链接失败
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: 装依赖
        run: |
          cd app && npm ci
          cd ../server && npm ci

      # 这里不加 --target：arm64 runner 上默认就编 aarch64，产物落在
      # target/release。一旦加了 --target，路径会变成
      # target/<triple>/release，下面 upload-artifact 的路径要同步改
      - name: 构建 macOS app 和 dmg
        run: cd app && npx tauri build --bundles app,dmg

      - name: 传产物
        uses: actions/upload-artifact@v4
        with:
          name: deskalarm-macos
          path: |
            app/src-tauri/target/release/bundle/macos/*.app
            app/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error