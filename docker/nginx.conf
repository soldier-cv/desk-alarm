# DeskAlarm 站点网关
# 一个 Nginx 同时做两件事：
#   /          静态原型
#   /api/      反代到 api 服务
#   /api/v1/stream  WebSocket 升级

upstream deskalarm_api {
    server api:8787;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen      80;
    server_name _;

    root  /usr/share/nginx/html;
    index prototype.html;

    # 原型里全是中文，强制声明编码，避免个别浏览器按 GBK 猜
    charset       utf-8;
    charset_types text/css application/javascript application/json image/svg+xml;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    client_max_body_size 256k;

    # ---------------------------------------------------------------- API
    location /api/ {
        proxy_pass         http://deskalarm_api;
        proxy_http_version 1.1;

        # WebSocket 升级。/api/v1/stream 走这条
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # 长连接不能被默认 60 秒超时掐掉
        proxy_connect_timeout 5s;
        proxy_read_timeout    3600s;
        proxy_send_timeout    3600s;
        proxy_buffering       off;
    }

    # API 的 healthz 挂在根路径，不在 /api/v1 下面。
    # proxy_pass 不带尾斜杠 = 原样透传 URI，所以这里显式指到根
    location = /healthz {
        proxy_pass       http://deskalarm_api/healthz;
        proxy_set_header Host $host;
        access_log       off;
    }

    # ------------------------------------------------------------ 静态资源
    location / {
        add_header Cache-Control "no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri $uri/ =404;
    }

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   6;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml;
}
