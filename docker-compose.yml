name: desk-alarm

services:
  # API 服务。砍掉 Web 端和静态原型后，nginx 网关只剩反代这一个作用，
  # 而 Fastify 自己就能处理 /api/*、/healthz 和 WebSocket，所以网关不再需要——
  # 客户端直接连 API。对外保留 8091（历史习惯 + 防火墙规则），容器内仍是 8787。
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    image: ${REGISTRY_HOST:-127.0.0.1:5000}/deskalarm-api:${IMAGE_TAG:-latest}
    container_name: deskalarm-api
    ports:
      # 对外地址：客户端和服务端地址都填这个
      - "${WEB_PORT:-8091}:8787"
    environment:
      # 只有连接信息需要进 env；其余固定值写死在这里。
      # 生产用宿主机 .env 里已有的数据库地址；本地调试用 docker-compose.local.yml 覆盖成 db
      PGHOST: "${PGHOST}"
      PGPORT: "${PGPORT:-5432}"
      PGDATABASE: "${PGDATABASE}"
      PGSCHEMA: "${PGSCHEMA:-desk_alarm}"
      PGUSER: "${PGUSER}"
      PGPASSWORD: "${PGPASSWORD:-deskalarm}"
      PG_POOL_MAX: "10"

      # 调度参数固定，不随部署变化
      TICK_MS: "1000"
      ROTATE_MS: "400"
      MISSED_AFTER_MS: "60000"
      DELIVERY_RETRY_MS: "120000"
      DELIVERY_MAX_ATTEMPTS: "5"
      LOG_LEVEL: "info"

      # Firebase。没配就走不了 FCM，Android 到点只会走 missed 补发
      FCM_PROJECT_ID: "${FCM_PROJECT_ID:-}"
      FCM_CLIENT_EMAIL: "${FCM_CLIENT_EMAIL:-}"
      FCM_PRIVATE_KEY: "${FCM_PRIVATE_KEY:-}"
      # Agent 令牌由每个用户在客户端自助签发，不再有全局 MCP_TOKEN
    restart: unless-stopped
    logging:
      driver: "json-file"
      options: { max-size: "10m", max-file: "3" }
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 384M }
        reservations: { cpus: "0.1", memory: 64M }
