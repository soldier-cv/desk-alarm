[package]
name = "deskalarm"
version = "0.1.0"
description = "Desktop alarm clock with server-side scheduling and multi-device delivery"
authors = ["soldier-cv"]
license = "MIT"
repository = "https://github.com/soldier-cv/desk-alarm"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "deskalarm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
# 自己拉 latest.json 做 Gitee/GitHub 降级，不用插件内置的 endpoint 轮询
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["time", "macros", "rt-multi-thread"] }
# 插件的 endpoints() 要的是 url::Url
url = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
