[package]
name = "deskalarm"
version = "0.1.0"
description = "Desktop alarm clock with server-side scheduling and multi-device delivery"
authors = ["soldier-cv"]
license = "MIT"
repository = "https://github.com/soldier-cv/desk-alarm"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "deskalarm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

# 单机自用，不做代码签名，减小构建复杂度。
# 真要分发再加 tauri-plugin-updater 和签名配置
[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
