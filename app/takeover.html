<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>DeskAlarm 正在呼叫你</title>
</head>
<body>
  <div class="tk" id="tk">
    <div class="tk-warn" aria-hidden="true">
      <span class="tk-warn-label" id="tk-warn-label">WARNING</span>
      <div class="tk-warn-track"><div class="tk-warn-text"><span>WARNING &nbsp;///&nbsp; WARNING &nbsp;///&nbsp; 强提醒到点，必须处理 &nbsp;///&nbsp;</span><span>WARNING &nbsp;///&nbsp; WARNING &nbsp;///&nbsp; 强提醒到点，必须处理 &nbsp;///&nbsp;</span></div></div>
    </div>

    <div class="tk-main">
      <div class="tk-head-row">
        <div class="tk-clock" id="tk-clock">--:--</div>
        <div class="tk-queue-badge" id="tk-queue" hidden></div>
      </div>
      <h2 class="tk-title" id="tk-title"></h2>
      <div class="tk-note" id="tk-note" hidden></div>
      <div class="tk-step-card" id="tk-step-card" hidden></div>
      <div class="tk-target" id="tk-target"></div>
      <div class="tk-where" id="tk-where"></div>

      <div class="tk-prog">
        <div class="meta">
          <span id="tk-stage">强提醒 · 到点了，先给它一个去向</span>
          <span class="mono" id="tk-elapsed">已等待 0 秒</span>
        </div>
        <div class="bar"><i id="tk-bar"></i></div>
      </div>
    </div>

    <div class="tk-foot">
      <div class="tk-acts" id="tk-acts"></div>
      <div class="tk-snooze" id="tk-snooze"></div>
    </div>
  </div>

  <script type="module" src="/src/ui/takeover.ts"></script>
</body>
</html>
