<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>快速记一条</title>
  <style>
    /* 这个窗口只有 560x132，样式内联在 html 里省一次往返 */
    html, body { height: 100%; }
    body {
      background: #0B0C0D; color: #ECEDEF; overflow: hidden;
      font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, "Microsoft YaHei", sans-serif;
      font-size: 13.5px; -webkit-app-region: drag;
    }
    .wrap { padding: 16px 16px 12px; display: flex; flex-direction: column; height: 100%; }
    .row { display: flex; align-items: center; gap: 10px; }
    .prompt { color: #5C6067; font-family: "Cascadia Mono", Consolas, monospace; font-size: 15px; }
    input {
      flex: 1; min-width: 0; background: none; border: none; outline: none;
      font: inherit; font-size: 14.5px; color: #ECEDEF; -webkit-app-region: no-drag;
    }
    input::placeholder { color: #5F636A; }
    #parse { display: flex; gap: 6px; margin-top: 11px; flex-wrap: wrap; }
    .foot { display: flex; align-items: center; justify-content: space-between; margin-top: auto; padding-top: 9px; }
    .hint { font-size: 11px; color: #5C6067; }
    .hint.ok { color: #5E8C7F; }
    .hint.err { color: #FF8A7C; }
    #bar { height: 2px; border-radius: 99px; background: #1B1D20; margin-top: 9px; overflow: hidden; }
    #bar.ready { background: linear-gradient(90deg, #FF5C2B 40%, #1B1D20 40%); }
    .chip {
      display: inline-flex; align-items: center; height: 21px; padding: 0 8px;
      border-radius: 6px; font-size: 11px; border: 1px solid #24262A;
      background: #15171A; color: #8C9097;
    }
    .chip.hot { border-color: rgba(255,92,43,.38); background: rgba(255,92,43,.12); color: #FFB292; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="row">
      <span class="prompt">&gt;</span>
      <input id="q" placeholder="一句话、链接、目录，或带时间" autocomplete="off" spellcheck="false">
    </div>
    <div id="parse" hidden></div>
    <div id="bar"></div>
    <div class="foot">
      <span class="hint" id="hint">Enter 保存，Esc 取消</span>
      <span class="hint">Ctrl+Shift+Space 随时唤起</span>
    </div>
  </div>
  <script type="module" src="/src/ui/capture.ts"></script>
</body>
</html>
