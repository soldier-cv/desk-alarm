# Woodpecker CI - desk-alarm (Woodpecker v3.19.0)
# 触发策略（仅 tag + manual，日常 push 不触发）：
#   1. tag: 推送 v* 标签（正式发版）
#   2. manual: Woodpecker 页面手动触发（可填 deploy_tag 变量指定版本标签，默认 latest）
# 链路：解析版本号并同步服务端文件至宿主机 -> TS 类型检查与编译校验 -> 本地构建 api/web 镜像并通过 docker compose 部署
when:
  - event: tag
    ref: refs/tags/v*
  - event: manual

# 版本号解析：tag 事件用 CI_COMMIT_TAG；manual 用页面填的 deploy_tag 变量
skip_clone: false

steps:
  - name: resolve-tag
    image: alpine:3.20
    volumes:
      - /opt/code/desk-alarm:/opt/code/desk-alarm
    commands:
      - mkdir -p /opt/code/desk-alarm
      # 同步服务端构建与运行所需目录（仅服务端与网关，保留宿主机已有 .env 生产配置）
      - cp -rf docker server shared mockups docker-compose.yml .dockerignore .env.example /opt/code/desk-alarm/
      - if [ ! -f /opt/code/desk-alarm/.env ]; then cp .env.example /opt/code/desk-alarm/.env; fi
      # tag 事件用 CI_COMMIT_TAG；manual 用页面参数 deploy_tag（大小写都认，Woodpecker 不做大写映射）
      - >-
        if [ -n "$${CI_COMMIT_TAG}" ]; then echo "$${CI_COMMIT_TAG}"; elif [ -n "$${deploy_tag:-}" ]; then echo "$${deploy_tag}"; elif [ -n "$${DEPLOY_TAG:-}" ]; then echo "$${DEPLOY_TAG}"; else echo latest; fi | tr -d ' ' > /tmp/release_tag
      - echo "RELEASE_TAG=$$(cat /tmp/release_tag)"
      - cp /tmp/release_tag /opt/code/desk-alarm/.release_tag

  - name: verify-server
    image: docker.1ms.run/library/node:22-alpine
    depends_on:
      - resolve-tag
    commands:
      - cd server
      - npm config set registry https://registry.npmmirror.com
      - npm ci --no-audit --no-fund
      - npm run typecheck
      - npm run build

  - name: build-and-deploy
    image: docker:26
    depends_on:
      - verify-server
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/code/desk-alarm:/opt/code/desk-alarm
    commands:
      - cd /opt/code/desk-alarm
      - RELEASE_TAG=$$(cat .release_tag)
      - test -n "$$REGISTRY_HOST" || { echo "缺少 registry_host 变量，不知道往哪个 registry 推" >&2; exit 1; }
      - echo "$$REGISTRY_PASS" | docker login "$$REGISTRY_HOST" -u $$REGISTRY_USER --password-stdin
      # 镜像铁律：推 registry，固定版本 + latest 同 digest
      - docker build -f docker/api.Dockerfile -t "$$REGISTRY_HOST/deskalarm-api:$${RELEASE_TAG}" -t "$$REGISTRY_HOST/deskalarm-api:latest" .
      - docker build -f docker/Dockerfile -t "$$REGISTRY_HOST/deskalarm-web:$${RELEASE_TAG}" -t "$$REGISTRY_HOST/deskalarm-web:latest" .
      - docker push "$$REGISTRY_HOST/deskalarm-api:$${RELEASE_TAG}"
      - docker push "$$REGISTRY_HOST/deskalarm-api:latest"
      - docker push "$$REGISTRY_HOST/deskalarm-web:$${RELEASE_TAG}"
      - docker push "$$REGISTRY_HOST/deskalarm-web:latest"
      - docker logout "$$REGISTRY_HOST"
      # compose 拉起（.env 保留宿主机生产配置）+ 健康验证
      - REGISTRY_HOST=$$REGISTRY_HOST IMAGE_TAG=$${RELEASE_TAG} docker compose up -d --force-recreate
      - docker compose ps
      - >-
        for i in $$(seq 1 30); do st=$$(docker inspect -f '{{.State.Health.Status}}' deskalarm-api 2>/dev/null || echo missing); if [ "$$st" = "healthy" ]; then echo "deploy OK: desk-alarm $${RELEASE_TAG} healthy"; exit 0; fi; echo "waiting health ($$i): $$st"; sleep 5; done; echo "health check failed" >&2; exit 1
    environment:
      REGISTRY_HOST:
        from_secret: registry_host
      REGISTRY_USER:
        from_secret: registry_user
      REGISTRY_PASS:
        from_secret: registry_pass
